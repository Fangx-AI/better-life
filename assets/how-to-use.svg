<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc"><title id="title">选处境，读要点，看出处</title><desc id="desc">第一步选择场景或关键词；第二步先读白话说明；第三步展开出处或收藏备用。</desc><rect width="1200" height="310" rx="20" fill="#171a17"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="44" y="46" font-size="12" fill="#a6ada0" letter-spacing="3">LESS SCROLLING. MORE ANSWERS.</text><g transform="translate(34 74)"><rect width="354" height="200" rx="12" fill="#252c22" stroke="#46533b"/><text x="26" y="46" font-size="15" fill="#d4ee83">01 / 找问题</text><text x="26" y="91" font-size="28" font-weight="bold" fill="#f1f0e8">从你的处境开始</text><text x="26" y="130" font-size="17" fill="#b4bea9">选场景，或搜一个关键词。</text><text x="26" y="172" font-size="14" fill="#d4ee83">离职 · 押金 · 医保 · 睡眠</text></g><g transform="translate(423 74)"><rect width="354" height="200" rx="12" fill="#252c22" stroke="#46533b"/><text x="26" y="46" font-size="15" fill="#d4ee83">02 / 读要点</text><text x="26" y="91" font-size="28" font-weight="bold" fill="#f1f0e8">先看白话说明</text><text x="26" y="130" font-size="17" fill="#b4bea9">不用读完，挑现在有用的。</text><text x="26" y="172" font-size="14" fill="#d4ee83">可以只看不花钱的建议</text></g><g transform="translate(812 74)"><rect width="354" height="200" rx="12" fill="#d4ee83"/><text x="26" y="46" font-size="15" fill="#44572c">03 / 留备用</text><text x="26" y="91" font-size="28" font-weight="bold" fill="#22291d">有用的一条，留下来</text><text x="26" y="130" font-size="17" fill="#44572c">收藏备用，需要时再查。</text><text x="26" y="172" font-size="14" fill="#44572c">成本 · 收益 · 出处</text></g></g></svg>
