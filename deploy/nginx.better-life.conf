# 模板：替换域名、证书与独立端口，使用已验证覆盖本域名的证书。
# 在Nginx http context中include。不得替换Image2已有server或upstream。
log_format better_life_minimal '$remote_addr $request_method $uri $status';

server {
    listen 80;
    server_name better-life.example.test;
    if ($host != "better-life.example.test") { return 444; }
    return 308 https://better-life.example.test$request_uri;
}

server {
    listen 443 ssl;
    server_name better-life.example.test;
    if ($host != "better-life.example.test") { return 444; }
    ssl_certificate /etc/letsencrypt/live/better-life.example.test/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/better-life.example.test/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 256k;
    access_log /var/log/nginx/better-life-access.log better_life_minimal;

    location / {
        proxy_pass http://127.0.0.1:4178;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 65s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
    }
}
